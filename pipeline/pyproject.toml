[project]
name = "pdpsi-pipeline"
version = "0.1.0"
description = "Pipeline data PDPSI: workbook GoKUPS menjadi rilis data publik berversi"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
]

[project.scripts]
pdpsi = "pdpsi_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdpsi_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
